[project]
name = "opusterra-backend"
version = "0.1.0"
description = "Backend de análisis de tendencias contrastantes para el reto NASA Space Apps 2026"
requires-python = ">=3.12"
dependencies = [
    "dask>=2025.1.0",
    "earthaccess>=0.19.0",
    "h5netcdf>=1.8.3",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydap>=3.5.11,<4",
    "pyhdf>=0.11.7",
    "rioxarray>=0.23.0",
    "scipy>=1.18.1",
    "xarray>=2026.9.0,<2027",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opusterra"]

[dependency-groups]
dev = [
    "pymannkendall>=1.4.3",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
